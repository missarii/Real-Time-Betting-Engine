<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Bet-X Sportsbook</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- NAV BAR -->
    <header>
        <div class="nav-container">
            <a th:href="@{/dashboard}" class="logo">🏆 <span>BET-X</span></a>
            <div class="nav-links">
                <a th:href="@{/dashboard}" class="nav-item active">Dashboard</a>
                <a th:href="@{/events}" class="nav-item">Sportsbook</a>
                <a th:href="@{/bets}" class="nav-item">My Bets</a>
                <a th:href="@{/wallet}" class="nav-item">Wallet</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="nav-item" style="color: var(--warning); border: 1px dashed var(--warning); border-radius: 6px;">Admin Room</a>
            </div>
            <div class="nav-user">
                <div class="balance-pill">
                    💵 $<span th:text="${#numbers.formatDecimal(wallet.balance, 1, 'COMMA', 2, 'POINT')}">1,000.00</span>
                </div>
                <span style="font-weight: 600; color: #fff;" th:text="${#authentication.name}">Username</span>
                <a th:href="@{/logout}" class="btn-logout">LOGOUT</a>
            </div>
        </div>
    </header>

    <!-- MAIN BODY -->
    <main class="main-container">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 2.25rem; font-weight: 800;">Welcome back, <span th:text="${#authentication.name}" style="color: var(--primary);">User</span>!</h1>
            <p style="color: var(--text-muted);">Real-Time live odds feeds are armed. Place bets securely.</p>
        </div>

        <div class="grid-2">
            <!-- LEFT PANEL -->
            <div style="display: flex; flex-direction: column; gap: 2rem;">
                
                <!-- LIVE MATCHES IN ACTION -->
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h2 style="font-size: 1.5rem; font-weight: 700;">🔥 Live Matches In Play</h2>
                        <a th:href="@{/events}" style="color: var(--primary); font-size: 0.95rem; font-weight: 600; text-decoration: underline;">View Full Sportsbook</a>
