<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bets - Bet-X</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- NAV BAR -->
    <header>
        <div class="nav-container">
            <a th:href="@{/dashboard}" class="logo">🏆 <span>BET-X</span></a>
            <div class="nav-links">
                <a th:href="@{/dashboard}" class="nav-item">Dashboard</a>
                <a th:href="@{/events}" class="nav-item">Sportsbook</a>
                <a th:href="@{/bets}" class="nav-item active">My Bets</a>
                <a th:href="@{/wallet}" class="nav-item">Wallet</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="nav-item" style="color: var(--warning); border: 1px dashed var(--warning); border-radius: 6px;">Admin Room</a>
            </div>
            <div class="nav-user">
                <div class="balance-pill">
                    💵 $<span th:text="${#numbers.formatDecimal(wallet.balance, 1, 'COMMA', 2, 'POINT')}">1,000.00</span>
                </div>
                <span style="font-weight: 600; color: #fff;" th:text="${#authentication.name}">Username</span>
                <a th:href="@{/logout}" class="btn-logout">LOGOUT</a>
            </div>
        </div>
    </header>

    <!-- MAIN BODY -->
    <main class="main-container">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 2.25rem; font-weight: 800;">My Betting Statement</h1>
            <p style="color: var(--text-muted);">Review your active bet slips and settled payout transactions history.</p>
        </div>

        <div class="glass-card">
            <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">🎫 My Bet Tickets</h2>

            <div th:if="${#lists.isEmpty(bets)}" class="betslip-empty" style="padding: 4rem 0;">
                <div style="font-size: 3.5rem; margin-bottom: 1rem;">🎰</div>
