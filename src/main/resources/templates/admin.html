<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Bet-X Control Room</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- NAV BAR -->
    <header>
        <div class="nav-container">
            <a th:href="@{/dashboard}" class="logo">🏆 <span>BET-X CONTROL PANEL</span></a>
            <div class="nav-links">
                <a th:href="@{/dashboard}" class="nav-item">Dashboard</a>
                <a th:href="@{/events}" class="nav-item">Sportsbook</a>
                <a th:href="@{/bets}" class="nav-item">My Bets</a>
                <a th:href="@{/wallet}" class="nav-item">Wallet</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="nav-item active" style="color: var(--warning); border: 1px dashed var(--warning); border-radius: 6px;">Admin Room</a>
            </div>
            <div class="nav-user">
                <span style="font-weight: 600; color: var(--warning); font-size: 0.95rem; border: 1px solid var(--warning); padding: 0.25rem 0.6rem; border-radius: 4px;">🛠️ ADMIN POWER</span>
                <span style="font-weight: 600; color: #fff; margin-left: 0.5rem;" th:text="${#authentication.name}">Username</span>
                <a th:href="@{/logout}" class="btn-logout">LOGOUT</a>
            </div>
        </div>
    </header>
