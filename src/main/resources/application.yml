server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: BETTING_SESSION

spring:
  application:
    name: betting-engine

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/betting_db
    username: betting_user
    password: betting_password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Hibernate can update/verify; sql init handles seed/initial structures
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
